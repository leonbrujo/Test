name: Editorial pipeline
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [collect, publish]
        required: true
      date:
        description: Edition date (YYYY-MM-DD; blank uses New York today)
        required: false
  push:
    branches: [editorial-pipeline]
    paths: ['editorial/**', '.github/workflows/editorial-pipeline.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile editorial/pipeline.py
      - run: python -m unittest discover -s editorial -p 'test_*.py'
      - name: Install browser for isolated visual test
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser smoke test
        run: python editorial/browser_test.py
      - if: github.event_name == 'push'
        run: |
          python editorial/pipeline.py collect
          python - <<'PY'
          import json, pathlib, collections
          for p in pathlib.Path("editorial/research").glob("*.json"):
              d=json.loads(p.read_text())
              print("RSS coverage:", dict(collections.Counter(x["category"] for x in d["items"])))
              print("Sources:", dict(collections.Counter(x["feed"] for x in d["items"])))
              print("Errors:", json.dumps(d["errors"]))
          PY
      - if: github.event_name == 'workflow_dispatch'
        env:
          MODE: ${{ inputs.mode }}
          DATE: ${{ inputs.date }}
        run: |
          if [ -n "$DATE" ]; then python editorial/pipeline.py "$MODE" --date "$DATE"; else python editorial/pipeline.py "$MODE"; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-dry-run
          path: |
            editorial/browser-results/
            editorial/research/
            observador-global/
